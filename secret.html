<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SISTEMA MAESTRO - Radio Valencianismo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --glass: rgba(15, 15, 25, 0.7);
            --accent: #ff2a2a;
            --gold: #ffd700;
            --cyan: #00f2fe;
            --green: #a8ff78;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Bloqueo de Seguridad */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
            transition: all 0.5s ease;
        }

        .auth-card {
            background: var(--glass);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
        }

        input[type="password"] {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 15px;
            border-radius: 12px;
            font-size: 1.5rem;
            text-align: center;
            width: 200px;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        /* Panel Principal */
        #master-panel {
            width: 90vw;
            height: 85vh;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .sidebar, .main-view {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        h2 { text-transform: uppercase; letter-spacing: 2px; font-weight: 800; color: var(--gold); margin-top: 0; }

        /* Status LEDs */
        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .led {
            width: 12px; height: 12px; border-radius: 50%;
            background: #333;
            box-shadow: 0 0 5px #000;
        }
        .led.on { background: var(--green); box-shadow: 0 0 15px var(--green); }

        /* Action Buttons */
        .btn-action {
            padding: 20px;
            border-radius: 16px;
            border: none;
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn-gotham { background: linear-gradient(135deg, #ff2a2a, #ff5e62); color: #fff; }
        .btn-donpio { background: linear-gradient(135deg, var(--gold), #ffb900); }
        .btn-news { background: linear-gradient(135deg, var(--cyan), #38ef7d); }

        .btn-action:hover { transform: scale(1.03) translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn-action:active { transform: scale(0.98); }

        /* Console */
        .console {
            background: #000;
            flex-grow: 1;
            border-radius: 16px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--green);
            overflow-y: auto;
            border: 1px solid rgba(168, 255, 120, 0.2);
        }

        .log-entry { margin-bottom: 5px; opacity: 0.8; }
        .log-entry.cmd { color: var(--gold); }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h1 style="color: var(--gold); margin-bottom: 10px;">ACCESO RESTRINGIDO</h1>
            <p style="opacity: 0.5; margin-bottom: 30px;">Introduce el Código de Mando</p>
            <input type="password" id="pin-input" placeholder="••••" maxlength="8">
            <br>
            <button onclick="checkAuth()" style="background: var(--gold); border: none; padding: 12px 40px; border-radius: 50px; font-weight: 800; cursor: pointer;">AUTORIZAR</button>
        </div>
    </div>

    <div id="master-panel">
        <div class="sidebar">
            <h2>Sistemas</h2>
            <div class="status-item">
                <span>Icecast Stream</span>
                <div id="led-icecast" class="led on"></div>
            </div>
            <div class="status-item">
                <span>Liquidsoap Engine</span>
                <div id="led-radio" class="led on"></div>
            </div>
            <div class="status-item">
                <span>TTS IA Service</span>
                <div id="led-tts" class="led"></div>
            </div>

            <h2 style="margin-top: 40px;">Control Directo</h2>
            <button class="btn-action btn-gotham" onclick="execute('lanzar_gotham')">
                <span>🚀</span> LANZAR GOTHAM VCF
            </button>
            <button class="btn-action btn-donpio" onclick="execute('lanzar_donpio')">
                <span>🎭</span> INYECTAR DON PÍO
            </button>
            <button class="btn-action btn-news" onclick="execute('refresh_news')">
                <span>📡</span> REFRESCAR NOTICIAS
            </button>
        </div>

        <div class="main-view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">Consola de Operaciones</h2>
                <button onclick="clearConsole()" style="background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 15px; border-radius: 8px; cursor: pointer;">Limpiar</button>
            </div>
            <div class="console" id="console-out">
                <div class="log-entry">Esperando órdenes...</div>
            </div>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = "VALENCIA_MAESTRO_2026"; // Mismo que en la API
        const API_URL = `http://${window.location.hostname}:8003/api/execute`;

        function checkAuth() {
            const input = document.getElementById('pin-input').value;
            // Aquí puedes poner la contraseña que quieras. Por defecto: 1919
            if(input === "1919") {
                document.getElementById('auth-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('master-panel').style.opacity = '1';
                    document.getElementById('master-panel').style.pointerEvents = 'all';
                    addLog("Sistemas autorizados. Bienvenido, Maestro.", "cmd");
                    refreshLogs();
                }, 500);
            } else {
                alert("ACCESO DENEGADO");
                document.getElementById('pin-input').value = "";
            }
        }

        async function execute(action) {
            if(!confirm(`¿Confirmas la ejecución de: ${action.replace('_', ' ')}?`)) return;

            addLog(`Ejecutando comando: ${action}...`, "cmd");
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: json.stringify({ action: action, token: AUTH_TOKEN })
                });
                const data = await res.json();
                addLog(`[SERVIDOR]: ${data.message}`);
            } catch (err) {
                addLog(`[ERROR]: No se pudo conectar con la API de Control.`, "cmd");
            }
        }

        function addLog(msg, type = "") {
            const consoleOut = document.getElementById('console-out');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `> [${new Date().toLocaleTimeString()}] ${msg}`;
            consoleOut.appendChild(entry);
            consoleOut.scrollTop = consoleOut.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console-out').innerHTML = '<div class="log-entry">Consola reseteada.</div>';
        }

        async function refreshLogs() {
            // Cada 10 segundos intentamos traer los últimos logs de monitor.log
            setInterval(async () => {
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: json.stringify({ action: "get_logs", token: AUTH_TOKEN })
                    });
                    const data = await res.json();
                    // Solo mostramos si hay algo nuevo (simplificado para la demo)
                } catch(e){}
            }, 10000);
        }

        // Permitir Enter en el input de contraseña
        document.getElementById('pin-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAuth();
        });
    </script>
</body>
</html>

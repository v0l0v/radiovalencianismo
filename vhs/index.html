<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Vídeo de Fondo (VHS)</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #000;
        }

        /* Contenedor del Vídeo */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Manda el vídeo al fondo */
            overflow: hidden;
        }

        /* La etiqueta de vídeo en sí */
        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que el vídeo rellene toda la pantalla sin deformarse */
            pointer-events: none; /* Evita que el usuario pueda interactuar con el vídeo */
            filter: contrast(1.2) saturate(1.2); /* Pequeño filtro para darle un look más retro/vhs si el vídeo es plano */
        }

        /* Capa oscura semitransparente sobre el vídeo para que el texto sea legible */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 0;
        }

        /* Contenido por encima del vídeo (El reproductor simulado) */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .retro-box {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ff0055; /* Un tono rosa neón ochentero */
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        p {
            font-size: 1.1rem;
            color: #ccc;
        }

        /* Efecto scanlines tipo VHS muy sutil usando un pattern CSS */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px; /* Tamaño de las líneas */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Capa de Vídeo de Fondo -->
    <div class="video-container">
        <!-- IMPORTANTE: autoplay, loop, muted y playsinline son obligatorios para que los navegadores móviles y de escritorio dejen que el vídeo se reproduzca solo al cargar la web -->
        <video id="bg-video" autoplay loop muted playsinline>
            <!-- Aquí he puesto un vídeo público de prueba. Cuando te descargues un loop retro en .mp4, ponlo en la carpeta vhs/ y cambia el src a src="mi_video_retro.mp4" -->
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Tu navegador no soporta vídeos HTML5.
        </video>
    </div>

    <div class="overlay"></div>
    <div class="scanlines"></div> <!-- Añade las líneas tipo TV de tubo -->

    <!-- Tu Reproductor -->
    <div class="content">
        <div class="retro-box">
            <h1>PRUEBA VHS</h1>
            <p>Este es un ejemplo de cómo queda un reproductor con vídeo `.mp4` de fondo (con efecto scanlines tipo TV antigua por encima).</p>
            <p>Pruébalo entrando a <strong>valencianismo.com/vhs</strong></p>
        </div>
    </div>

</body>
</html>

services:
  web:
    image: nginx:alpine
    container_name: radiovalencianismo-web
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped

  n8n:
    build: ./backend/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_NODES=
      - N8N_NODES_EXCLUDE_SSH_EXECUTION=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backend/mp3:/mp3
      - ./backend/n8n/tagger.js:/home/node/tagger.js:ro
    restart: unless-stopped

  icecast:
    image: pltnk/icecast2
    container_name: icecast
    ports:
      - "8000:8000"
    volumes:
      - ./backend/icecast.xml:/etc/icecast.xml:ro
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:main
    container_name: liquidsoap
    ports:
      - "8080:8080"
    volumes:
      - ./backend/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./backend/mp3:/mp3:ro
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]
    depends_on:
      - icecast
    restart: unless-stopped

volumes:
  n8n_data:

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valencianismo Lo-Fi — Radio Relajante</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS Estilos -->
    <link rel="stylesheet" href="lofi.css">
</head>
<body>
    <!-- Capa de Fondo (Ambiente) -->
    <div class="background-container" id="bg-container">
        <!-- 4 Hotspots invisibles (zona clicable con cursor zoom-in por color) -->
        <button class="hs-btn" id="hs-blue"   aria-label="Punt d'informació"></button>
        <button class="hs-btn" id="hs-red"    aria-label="Punt d'informació"></button>
        <button class="hs-btn" id="hs-green"  aria-label="Punt d'informació"></button>
        <button class="hs-btn" id="hs-yellow" aria-label="Punt d'informació"></button>

        <!-- Anillos finos sobre cada hotspot (aparecen al acercarse) -->
        <div class="hs-ring" id="hr-blue"></div>
        <div class="hs-ring" id="hr-red"></div>
        <div class="hs-ring" id="hr-green"></div>
        <div class="hs-ring" id="hr-yellow"></div>
    </div>

    <!-- 4 Punts de proximitat (un per color) -->
    <div class="prox-dot" id="pd-blue"></div>
    <div class="prox-dot" id="pd-green"></div>
    <div class="prox-dot" id="pd-red"></div>
    <div class="prox-dot" id="pd-yellow"></div>

    <!-- Modal d'informació (més gran, sense enllaç extern) -->
    <div id="hotspot-modal" role="dialog" aria-modal="true">
        <div id="hotspot-modal-box">
            <button id="hotspot-modal-close" aria-label="Tancar">✕</button>
            <div id="hotspot-modal-icon">📖</div>
            <h3 id="hotspot-modal-title"></h3>
            <p id="hotspot-modal-desc"></p>
        </div>
    </div>

    
    <!-- Contenedor Principal (Experiencia Minimalista) -->
    <div class="app-container">
        
        <!-- Reloj Analógico (Esquina Superior Derecha) -->
        <div class="clock-widget">
            <div class="clock">
                <div class="hand hour" id="hour-hand"></div>
                <div class="hand minute" id="min-hand"></div>
                <div class="hand second" id="sec-hand"></div>
                <div class="center-dot"></div>
            </div>
            <div class="digital-time" id="digital-time">00:00:00</div>
        </div>

        <!-- Panel del Reproductor (Glassmorphism abajo a la izquierda) -->
        <main class="player-panel" id="player-panel">
            <header class="player-header">
                <!-- Logotipo de Valencianismo Radio para volver a valencianismo.com -->
                <a href="https://valencianismo.com" class="logo-link" title="Volver a Valencianismo.com">
                    <img src="assets/logoVR180.png" alt="Logo Valencianismo Radio" class="player-logo">
                </a>
                
                <div class="player-header-text">
                    <span class="badge">EMISIÓN EN DIRECTO</span>
                    <div class="title-row">
                        <h1 class="radio-title">Valencianismo Radio</h1>
                        <!-- Botón Play/Pausa en cabecera (solo visible si está minimizado) -->
                        <button class="control-btn play-btn header-play-btn" id="play-pause-btn-header" aria-label="Reproducir">
                            <svg class="play-icon" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg class="pause-icon hidden" viewBox="0 0 24 24">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                        </button>
                    </div>
                    <p class="tagline">Tu compañía de fondo para trabajar y estudiar</p>
                </div>
                
                <div class="player-header-actions">
                    <!-- Botón de Pantalla Completa (Fullscreen) -->
                    <button class="player-fullscreen-btn" id="fullscreen-btn" title="Pantalla Completa">⛶</button>
                    <!-- Botón para Minimizar / Maximizar el reproductor -->
                    <button class="player-toggle-btn" id="toggle-player-btn" title="Minimizar Reproductor">▼</button>
                </div>
            </header>

            <!-- Contenido del cuerpo del reproductor -->
            <div class="player-body" id="player-body">
                <div class="player-controls-row">
                    <!-- Metadata Display (Canción Actual) -->
                    <div class="now-playing">
                        <div class="music-icon">
                            <span class="bar"></span>
                            <span class="bar"></span>
                            <span class="bar"></span>
                        </div>
                        <div class="track-info">
                            <span class="now-playing-label">SONANDO AHORA</span>
                            <div class="track-title-wrapper">
                                <h2 class="track-title" id="track-title">Cargando emisión...</h2>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Botón Play/Pausa Principal (Abajo en el cuerpo) -->
                    <button class="control-btn play-btn body-play-btn" id="play-pause-btn-body" aria-label="Reproducir">
                        <svg class="play-icon" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="pause-icon hidden" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Panel de Sintonización de Ambiente (Desplegable integrado) -->
            <footer class="player-footer" id="player-footer">
                <div class="ambient-controls">
                    <!-- Solo el botón de despliegue inferior -->
                    <button class="footer-btn" id="toggle-selector-btn" title="Mostrar ambientes">▲</button>
                </div>
                
                <div class="ambient-selector-wrapper collapsed" id="ambient-selector-wrapper">
                    <span class="ambient-label">AMBIENTE ACTUAL: <strong id="ambient-name">Cargando...</strong></span>
                    <div class="ambient-selector">
                        <button class="ambient-btn" data-ambient="serranos" title="🛡️ Torres de Serrans y la Senyera">1</button>
                        <button class="ambient-btn" data-ambient="xativa" title="🏰 Castell de Xàtiva">2</button>
                        <button class="ambient-btn" data-ambient="cyberpunk" title="⚡ Ciutat de les Arts Cyberpunk">3</button>
                        <button class="ambient-btn" data-ambient="malvarrosa" title="🌅 Amanecer en la Malvarrosa">4</button>
                        <button class="ambient-btn" data-ambient="space" title="🚀 Órbita sobre Valencia">5</button>
                        <button class="ambient-btn" data-ambient="lonja_mercado" title="🕰️ Lonja y Mercat Central (1920)">6</button>
                        <button class="ambient-btn" data-ambient="cac" title="🏙️ Ciutat de les Arts i les Ciències">7</button>
                        <button class="ambient-btn" data-ambient="valencia" title="🍊 Barraca en la Albufera">8</button>
                        <button class="ambient-btn" data-ambient="naranjos_360" title="🍊 Campo de Naranjos">9</button>
                        <button class="ambient-btn" data-ambient="mestalla" title="🦇 Estadio de Mestalla">10</button>
                    </div>
                </div>
            </footer>
        </main>
        
        <!-- Marca de Agua Sutil -->
        <div class="watermark">
            <span>lofi.valencianismo.com</span>
        </div>
    </div>

    <!-- Controles de Zoom y Pantalla Completa (Estilo Google Maps) -->
    <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-fullscreen-btn" aria-label="Pantalla completa">
            <svg class="fs-enter-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            <svg class="fs-exit-icon hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"/>
            </svg>
        </button>
        <button class="zoom-btn" id="zoom-in-btn" aria-label="Acercar">+</button>
        <button class="zoom-btn" id="zoom-out-btn" aria-label="Alejar">−</button>
    </div>

    <!-- Elemento Audio Oculto (Apunta al stream de la radio) -->
    <audio id="radio-audio" src="https://valencianismo.com/stream_musical" preload="none" crossorigin="anonymous"></audio>

    <!-- JS Lógica -->
    <script src="lofi.js"></script>
</body>
</html>

services:
  web:
    image: caddy:alpine
    container_name: radiovalencianismo-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  icecast:
    image: pltnk/icecast2
    container_name: icecast
    ports:
      - "8000:8000"
    volumes:
      - ./backend/icecast.xml:/etc/icecast.xml:ro
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:main
    container_name: liquidsoap
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./backend/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./backend/mp3:/mp3:ro
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]
    depends_on:
      - icecast
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

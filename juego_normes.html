<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tir al Moniato | Valencianismo Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        body { 
            margin: 0; background: #0a0a0f; color: #fff; 
            font-family: 'Outfit', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }
        #game-container { 
            position: relative; width: min(500px, 95vw); height: min(500px, 95vw); 
            background: url('assets/diana_juego.webp') center/cover; 
            border-radius: 20px; box-shadow: 0 0 40px rgba(0, 102, 204, 0.4); 
            overflow: hidden; cursor: crosshair;
        }
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; 
        }
        .ui { 
            text-align: center; margin-bottom: 20px; z-index: 20; 
            background: rgba(255,255,255,0.05); padding: 15px 30px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
        .score-board { 
            display: flex; gap: 15px; justify-content: center; margin-top: 15px; 
        }
        .circle-indicator { 
            width: 25px; height: 25px; border-radius: 50%; border: 2px solid #555; background: transparent; 
            display: flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: bold; color: #555;
            transition: all 0.3s;
        }
        .circle-indicator.hit { 
            background: #ffd700; border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.8); color: #000; 
        }
        
        /* Modal Question */
        #q-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); 
            z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; 
        }
        .q-box { 
            background: #1a1a24; padding: 40px; border-radius: 20px; max-width: 90%; width: 500px; 
            text-align: center; border: 2px solid #00d2ff; box-shadow: 0 10px 40px rgba(0,210,255,0.3); 
        }
        .q-btn { 
            display: block; width: 100%; padding: 15px; margin: 12px 0; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
            color: white; border-radius: 10px; font-size: 1.1rem; cursor: pointer; 
            transition: all 0.2s; font-family: 'Outfit', sans-serif; font-weight: 600;
        }
        .q-btn:hover { 
            background: #00d2ff; color: #000; border-color: #00d2ff; transform: scale(1.02);
        }
        
        .message { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 800; text-transform: uppercase; 
            text-shadow: 0 5px 20px #000; z-index: 50; display: none; pointer-events: none; 
            text-align: center; width: 100%;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .blink-text { animation: blink 1.2s infinite; pointer-events: none; }
        
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255,255,255,0.1); color: #fff; text-decoration: none;
            padding: 10px 20px; border-radius: 50px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        /* Intro Screen */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(10,10,15,0.95), rgba(20,10,5,0.95)), url('assets/diana_juego.webp') center/cover;
            z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        .intro-box {
            background: rgba(10,10,15,0.85); backdrop-filter: blur(15px);
            border: 2px solid #ffd700; border-radius: 20px; padding: 40px;
            max-width: 600px; box-shadow: 0 20px 60px rgba(255,215,0,0.2);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .intro-title {
            font-size: 3rem; color: #ffd700; margin: 0 0 10px 0; text-transform: uppercase;
            text-shadow: 0 5px 15px rgba(255,215,0,0.5); letter-spacing: 2px;
        }
        .intro-desc {
            font-size: 1.1rem; color: #ccc; line-height: 1.6; margin-bottom: 30px;
        }
        
        .mode-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 18px; margin: 15px 0;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 1.2rem; font-weight: 800; border-radius: 50px;
            cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }
        .mode-btn.tinta:hover { background: #00d2ff; color: #000; border-color: #00d2ff; box-shadow: 0 5px 20px rgba(0,210,255,0.4); transform: scale(1.02); }
        .mode-btn.cyber:hover { background: #00ff41; color: #000; border-color: #00ff41; box-shadow: 0 5px 20px rgba(0,255,65,0.4); transform: scale(1.02); }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div class="intro-box">
            <h1 class="intro-title">🎯 Tir al Moniato</h1>
            <p class="intro-desc">Apunta, dispara i demostra els teus coneiximents històrics i ortogràfics sobre les <strong>Normes d'El Puig</strong>. Tens 9 fletxes. Selecciona la teua arma:</p>
            <button class="mode-btn tinta" onclick="startGameMode(1)">🪶 Mode Ploma i Tinta</button>
            <button class="mode-btn cyber" onclick="startGameMode(2)">⚡ Mode Dard Cibernètic</button>
        </div>
        <script>
            function startGameMode(mode) {
                gameMode = mode;
                document.getElementById('intro-screen').style.display = 'none';
                
                // Update UI based on mode
                if (mode === 2) {
                    document.getElementById('title-text').innerText = '⚡ Tir al Moniato 2077';
                    document.getElementById('title-text').style.color = '#00ff41';
                    document.getElementById('title-text').style.textShadow = '0 0 15px #00ff41';
                    // Apply a cyberpunk look to the container
                    document.getElementById('game-container').style.boxShadow = '0 0 40px rgba(0, 255, 65, 0.4)';
                    document.getElementById('game-container').style.border = '2px solid #00ff41';
                }
                
                startAim();
                loop();
            }
        </script>
    </div>

    <div class="ui" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
        <h1 id="title-text" style="color: #ffd700; margin: 0 0 5px 0;">🪶 Tir al Moniato</h1>
        <p style="margin: 0; color: #ccc;">Tens 9 intents. ¡Encerta el centre (9 punts) per a fer la màxima puntuació!</p>
        <div class="score-board" id="scoreboard">
            <!-- 9 indicators -->
            <div class="circle-indicator" id="c1" title="Tir 1">-</div>
            <div class="circle-indicator" id="c2" title="Tir 2">-</div>
            <div class="circle-indicator" id="c3" title="Tir 3">-</div>
            <div class="circle-indicator" id="c4" title="Tir 4">-</div>
            <div class="circle-indicator" id="c5" title="Tir 5">-</div>
            <div class="circle-indicator" id="c6" title="Tir 6">-</div>
            <div class="circle-indicator" id="c7" title="Tir 7">-</div>
            <div class="circle-indicator" id="c8" title="Tir 8">-</div>
            <div class="circle-indicator" id="c9" title="Tir 9">-</div>
        </div>
        <h2 style="color: #00d2ff; margin: 10px 0 0 0;" id="total-score">Punts: 0</h2>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="message" id="msg-text"></div>
        <div id="end-buttons" style="display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; gap: 15px;">
            <button id="btn-download" style="display: none; background: #8a9a5b; color: #fff; border: 3px solid #4a3600; padding: 15px 30px; font-size: 1.1rem; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.8); text-transform: uppercase;">📸 Descarregar</button>
            <button id="btn-share" style="background: #7928ca; color: #fff; border: 3px solid #3b0d6b; padding: 15px 30px; font-size: 1.1rem; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.8); text-transform: uppercase;">🔗 Compartir</button>
        </div>
    </div>

    <div id="q-modal">
        <div class="q-box">
            <h2 id="question-text" style="color:#ffd700; margin-top:0; font-size: 1.5rem; line-height: 1.4;">Pregunta</h2>
            <div id="options"></div>
        </div>
    </div>

    <script src="js/preguntes_racv.js?v=1.1"></script>
    <script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const bgImg = new Image();
        bgImg.src = 'assets/diana_juego.webp';
        
        const fuegoRealImg = new Image();
        fuegoRealImg.src = 'assets/fuego_foto.png';
        const agujeroImg = new Image();
        agujeroImg.src = 'assets/agujero_tela_masked.png';
        let W = container.clientWidth;
        let H = container.clientHeight;
        canvas.width = W;
        canvas.height = H;

        // Target setup
        const circles = 9;
        let radiusStep = (W/2) / (circles + 1);
        let maxRadius = circles * radiusStep;
        
        // State
        let aimX = W/2, aimY = H/2;
        let time = 0;
        let isAiming = true;
        let frozenX = 0, frozenY = 0;
        let attempts = 0;
        let totalScore = 0;
        const maxAttempts = 9;
        let darts = [];
        let aimTimer = null;
        let hasBeenWarned = false;
        let aimStartTime = 0;
        let gameEnded = false;
        let gameMode = 1; // 1 = Pluma i Tinta
        document.getElementById('game-container').style.backgroundImage = "url('assets/diana_juego.webp')";
        bgImg.src = 'assets/diana_juego.webp';
        
        function startAim() {
            isAiming = true;
            aimStartTime = Date.now();
            clearTimeout(aimTimer);
            aimTimer = setTimeout(() => {
                if (!isAiming) return;
                isAiming = false;
                if (!hasBeenWarned) {
                    hasBeenWarned = true;
                    showMessage("¡AFANYA'T!\nTens 5 segons per disparar o fallaràs.\n(Mou el ratolí per a continuar)", "#fff", "#ff9900", false);
                    const onMove = () => {
                        canvas.removeEventListener('mousemove', onMove);
                        document.getElementById('msg-text').style.display = 'none';
                        startAim();
                    };
                    canvas.addEventListener('mousemove', onMove);
                } else {
                    frozenX = W/2;
                    frozenY = H/2;
                    handleAnswer(false, true);
                }
            }, 5000);
        }
        
        // Preguntes persistents en localStorage
        let activeQuestionIndices = [];

        function initQuestions() {
            let playedIndices = [];
            try {
                playedIndices = JSON.parse(localStorage.getItem('moniato_played_questions')) || [];
            } catch(e) {
                playedIndices = [];
            }

            // Si s'han jugat totes, es reinicia l'historial
            if (playedIndices.length >= questionsRACV.length) {
                playedIndices = [];
                localStorage.setItem('moniato_played_questions', JSON.stringify([]));
            }

            // Filtrar les preguntes que encara no s'han jugat
            let available = [];
            for (let i = 0; i < questionsRACV.length; i++) {
                if (!playedIndices.includes(i)) {
                    available.push(i);
                }
            }

            // Si queden menys de 9 per a completar la partida, reiniciem l'historial
            if (available.length < 9) {
                playedIndices = [];
                localStorage.setItem('moniato_played_questions', JSON.stringify([]));
                available = questionsRACV.map((_, i) => i);
            }

            // Barallar de forma aleatòria les preguntes disponibles
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }

            // Agafar 9 preguntes per a esta partida i marcar-les com a jugades
            activeQuestionIndices = available.slice(0, 9);
            playedIndices = playedIndices.concat(activeQuestionIndices);
            localStorage.setItem('moniato_played_questions', JSON.stringify(playedIndices));
        }

        initQuestions();

        function getNextQuestion() {
            if (activeQuestionIndices.length === 0) {
                initQuestions();
            }
            return activeQuestionIndices.pop();
        }

        function drawTarget() {
            ctx.clearRect(0, 0, W, H);
            
            // Draw background dark tint (very light so face is visible)
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fillRect(0,0,W,H);
            
            // Draw concentric circles
            for(let i=circles; i>=1; i--) {
                ctx.beginPath();
                ctx.arc(W/2, H/2, i * radiusStep, 0, Math.PI*2);
                
                // Color alternates: faint fill, strong borders so the face is visible
                ctx.fillStyle = (i % 2 !== 0) ? "rgba(255,215,0,0.05)" : "rgba(255,42,42,0.08)";
                
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = (i % 2 !== 0) ? "rgba(255,215,0,0.8)" : "rgba(255,42,42,0.9)";
                
                ctx.stroke();
            }
            
            // Draw impactos
            darts.forEach((d, idx) => {
                if (gameMode === 1) {
                    drawQuillAndSplat(ctx, d.x, d.y, 22, d.correct, idx);
                } else {
                    drawCyberDartAndGlitch(ctx, d.x, d.y, 25, d.correct, idx);
                }
            });

            // Draw Crosshair
            if (isAiming) {
                // Countdown timer
                const timeLeft = Math.max(0, 5 - Math.floor((Date.now() - aimStartTime) / 1000));
                ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                ctx.font = "bold " + (radiusStep * 1.5) + "px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(timeLeft, W/2, H/2);
                
                // Lissajous movement
                aimX = W/2 + Math.sin(time * 0.03) * (maxRadius * 0.9);
                aimY = H/2 + Math.cos(time * 0.043) * (maxRadius * 0.9);
                
                ctx.beginPath();
                ctx.arc(aimX, aimY, 15, 0, Math.PI*2);
                ctx.strokeStyle = "#00d2ff";
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(aimX-25, aimY); ctx.lineTo(aimX+25, aimY);
                ctx.moveTo(aimX, aimY-25); ctx.lineTo(aimX, aimY+25);
                ctx.stroke();
            } else {
                // Frozen crosshair
                ctx.beginPath();
                ctx.arc(frozenX, frozenY, 15, 0, Math.PI*2);
                ctx.strokeStyle = "#ff2a2a";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(frozenX-25, frozenY); ctx.lineTo(frozenX+25, frozenY);
                ctx.moveTo(frozenX, frozenY-25); ctx.lineTo(frozenX, frozenY+25);
                ctx.stroke();
            }
        }
        
        function loop() {
            if (isAiming) time++;
            drawTarget();
            requestAnimationFrame(loop);
        }
        
        // Interaction
        canvas.addEventListener('click', (e) => {
            if (gameEnded) {
                gameEnded = false;
                document.getElementById('end-buttons').style.display = 'none';
                const msg = document.getElementById('msg-text');
                msg.classList.remove('blink-text');
                msg.style.display = 'none';
                
                attempts = 0;
                totalScore = 0;
                document.getElementById('total-score').innerText = `Punts: 0`;
                darts = [];
                for(let i=1; i<=9; i++) {
                    const ind = document.getElementById('c'+i);
                    ind.classList.remove('hit');
                    ind.innerText = '-';
                    ind.style.background = '';
                    ind.style.borderColor = '';
                    ind.style.color = '';
                }
                hasBeenWarned = false;
                
                // Carregar un nou set de 9 preguntes lliures de repeticions per a la nova partida
                initQuestions();
                
                startAim();
                return;
            }

            if (!isAiming) return;
            clearTimeout(aimTimer);
            isAiming = false;
            
            frozenX = aimX;
            frozenY = aimY;
            
            setTimeout(() => {
                document.getElementById('msg-text').style.display = 'none';
                const qIndex = getNextQuestion();
                askQuestion(questionsRACV[qIndex]);
            }, 1800); // 1.8 sec pause
        });
        
        function askQuestion(qObj) {
            document.getElementById('q-modal').style.display = 'flex';
            document.getElementById('question-text').innerText = qObj.q;
            
            const optsDiv = document.getElementById('options');
            optsDiv.innerHTML = '';
            
            // Create a scrambled list of options
            let opts = qObj.o.map((o, i) => ({t: o, correct: i === qObj.a}));
            opts.sort(() => Math.random() - 0.5);
            
            opts.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'q-btn';
                btn.innerText = opt.t;
                btn.onclick = () => {
                    const allBtns = optsDiv.querySelectorAll('.q-btn');
                    allBtns.forEach(b => b.style.pointerEvents = 'none'); // Evitar doble click
                    
                    if (opt.correct) {
                        btn.style.background = '#00ff00';
                        btn.style.color = '#000';
                        btn.style.borderColor = '#00ff00';
                    } else {
                        btn.style.background = '#ff2a2a';
                        btn.style.color = '#fff';
                        btn.style.borderColor = '#ff2a2a';
                        // Resaltar la correcta
                        allBtns.forEach(b => {
                            if (b.innerText === qObj.o[qObj.a]) {
                                b.style.background = 'rgba(0, 255, 0, 0.8)';
                                b.style.color = '#000';
                                b.style.border = '2px solid #00ff00';
                            }
                        });
                    }
                    
                    setTimeout(() => handleAnswer(opt.correct), 2500); // 2.5s margin
                };
                optsDiv.appendChild(btn);
            });
        }
        
        function handleAnswer(isCorrect, isTimeout = false) {
            document.getElementById('q-modal').style.display = 'none';
            
            let dartX = frozenX;
            let dartY = frozenY;
            
            if (!isCorrect) {
                // Deviate wildly (50% to 150% of radius away)
                const angle = Math.random() * Math.PI * 2;
                const offset = (Math.random() * 1.0 + 0.5) * maxRadius;
                dartX += Math.cos(angle) * offset;
                dartY += Math.sin(angle) * offset;
                if (isTimeout) {
                    showMessage("¡TEMPS ESGOTAT!", "#fff", "#ff2a2a");
                } else {
                    showMessage("¡HAS FALLAT!", "#ff2a2a");
                }
            } else {
                showMessage("¡AHÍ LI DOL!", "#00d2ff");
            }
            
            darts.push({x: dartX, y: dartY, correct: isCorrect});
            
            // Calculate points
            let points = 0;
            const dist = Math.sqrt(Math.pow(dartX - W/2, 2) + Math.pow(dartY - H/2, 2));
            
            if (isCorrect && dist <= maxRadius) {
                const ringIndex = Math.floor(dist / radiusStep); // 0 is center, 8 is outermost
                if (ringIndex >= 0 && ringIndex < circles) {
                    points = circles - ringIndex; // Center = 9, outer = 1
                }
            }
            
            attempts++;
            totalScore += points;
            document.getElementById('total-score').innerText = `Punts: ${totalScore}`;
            
            // Update UI indicator
            const indicator = document.getElementById('c' + attempts);
            if (indicator) {
                indicator.innerText = points;
                indicator.classList.add('hit');
                if (points === 0) {
                    indicator.style.background = '#ff2a2a';
                    indicator.style.borderColor = '#ff2a2a';
                    indicator.style.color = '#fff';
                }
            }
            
            // Check end game
            if (attempts >= maxAttempts) {
                setTimeout(() => {
                    gameEnded = true;
                    document.getElementById('end-buttons').style.display = 'flex';
                    const msg = document.getElementById('msg-text');
                    msg.classList.add('blink-text');
                    showMessage(`¡FI DEL JOC!\n${totalScore} / 81\n(Fes clic per jugar atra volta)`, "#000", "#ffd700", false);
                }, 1500);
            } else {
                setTimeout(() => {
                    if (isTimeout) {
                        const onMoveTimeout = () => {
                            canvas.removeEventListener('mousemove', onMoveTimeout);
                            startAim();
                        };
                        canvas.addEventListener('mousemove', onMoveTimeout);
                    } else {
                        startAim();
                    }
                }, 1500);
            }
        }
        
        function showMessage(txt, color, bg = 'transparent', autoHide = true) {
            const msg = document.getElementById('msg-text');
            msg.innerText = txt;
            msg.style.color = color;
            msg.style.background = bg;
            if (bg !== 'transparent') {
                msg.style.padding = '15px 30px';
                msg.style.borderRadius = '10px';
                msg.style.border = `2px solid ${color === '#fff' ? 'rgba(255,255,255,0.3)' : color}`;
            } else {
                msg.style.padding = '0';
                msg.style.border = 'none';
            }
            msg.style.display = 'block';
            if (autoHide) {
                setTimeout(() => { msg.style.display = 'none'; }, 1500);
            }
        }
        
        const resizeObserver = new ResizeObserver(() => {
            if (container.clientWidth > 0) {
                W = container.clientWidth;
                H = container.clientHeight;
                canvas.width = W;
                canvas.height = H;
                radiusStep = (W/2) / (circles + 1);
                maxRadius = circles * radiusStep;
            }
        });
        resizeObserver.observe(container);
        
        function drawQuillAndSplat(octx, x, y, size, isCorrect, index, drawObject = true) {
            octx.save();
            
            const seed = (index * 123.456) % 100;

            if (drawObject) {
                const splatColor = isCorrect ? "#0033cc" : "#cc0000"; 
                octx.fillStyle = splatColor;
                
                const splatRadius = size * 0.8;
                octx.beginPath();
                octx.arc(x, y, splatRadius * 0.6, 0, Math.PI * 2);
                octx.fill();
                
                for (let i = 0; i < 7; i++) {
                    const angle = (i * Math.PI * 2) / 7 + seed;
                    const dropDist = splatRadius * (0.9 + ((seed + i) % 5) / 10);
                    const dropSize = splatRadius * 0.35 * (1 - (i % 3) * 0.2);
                    
                    octx.beginPath();
                    octx.arc(x + Math.cos(angle) * dropDist, y + Math.sin(angle) * dropDist, dropSize, 0, Math.PI * 2);
                    octx.fill();
                    
                    octx.beginPath();
                    octx.moveTo(x, y);
                    octx.lineTo(x + Math.cos(angle) * dropDist, y + Math.sin(angle) * dropDist);
                    octx.strokeStyle = splatColor;
                    octx.lineWidth = dropSize * 0.8;
                    octx.stroke();
                }

                octx.translate(x, y);
                const rotations = [-Math.PI/6, -Math.PI/4, -Math.PI/12, -Math.PI/3];
                const rot = rotations[index % rotations.length] || -Math.PI/4;
                octx.rotate(rot);
                
                octx.fillStyle = "#f8f9fa";
                octx.strokeStyle = "#e9ecef";
                octx.lineWidth = size * 0.05;
                
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.quadraticCurveTo(size * 0.5, -size * 0.2, size * 2.5, -size * 2.5);
                octx.quadraticCurveTo(size * 0.8, -size * 1.5, size * 0.2, -size * 0.5);
                octx.closePath();
                octx.fill();
                octx.stroke();
                
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.quadraticCurveTo(size * 0.2, -size * 0.5, size * 2.5, -size * 2.5);
                octx.quadraticCurveTo(size * 1.5, -size * 0.8, size * 0.5, -size * 0.2);
                octx.closePath();
                octx.fill();
                octx.stroke();
                
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.quadraticCurveTo(size * 1.0, -size * 1.0, size * 2.5, -size * 2.5);
                octx.strokeStyle = "#dee2e6";
                octx.lineWidth = size * 0.08;
                octx.stroke();

                octx.beginPath();
                octx.moveTo(0, 0);
                octx.lineTo(size * 0.3, -size * 0.1);
                octx.lineTo(size * 0.1, -size * 0.3);
                octx.closePath();
                octx.fillStyle = splatColor;
                octx.fill();
            } else {
                // Tinta realista para la imagen final
                octx.globalCompositeOperation = "multiply"; // La tinta "tinta" el papel oscureciéndolo
                
                // Azul índigo intenso si acierta, rojo carmesí oscuro si falla
                const baseRGB = isCorrect ? "10, 30, 110" : "130, 10, 20";
                
                const splatRadius = size * 2.8; // Mancha mucho más grande
                octx.translate(x, y);
                octx.rotate(seed); // Orientación completamente aleatoria
                
                // 1. Mancha absorbida (borde suave e irregular)
                octx.fillStyle = `rgba(${baseRGB}, 0.35)`;
                octx.beginPath();
                for (let i = 0; i < 12; i++) {
                    const angle = (i * Math.PI * 2) / 12;
                    const r = splatRadius * 0.7 * (0.7 + ((seed * i) % 6) / 10);
                    if (i === 0) octx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else octx.bezierCurveTo(
                        Math.cos(angle - 0.2) * r, Math.sin(angle - 0.2) * r,
                        Math.cos(angle) * r, Math.sin(angle) * r,
                        Math.cos(angle) * r, Math.sin(angle) * r
                    );
                }
                octx.closePath();
                octx.fill();
                
                // 2. Núcleo denso y oscuro de la mancha
                octx.fillStyle = `rgba(${baseRGB}, 0.85)`;
                octx.beginPath();
                for (let i = 0; i < 9; i++) {
                    const angle = (i * Math.PI * 2) / 9;
                    const r = splatRadius * 0.45 * (0.5 + ((seed * i * 3) % 8) / 10);
                    if (i === 0) octx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else octx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                octx.closePath();
                octx.fill();

                // 3. Salpicaduras dinámicas y gotas explosivas
                const drops = 15 + (seed % 12); // Entre 15 y 27 gotas
                for (let i = 0; i < drops; i++) {
                    const angle = (i * Math.PI * 2) / drops + ((seed * i) % 1);
                    const dist = splatRadius * (0.3 + ((seed * i * 7) % 15) / 10); // Variación de distancia
                    const dropSize = splatRadius * 0.15 * (1 - ((seed * i) % 8) / 10);
                    
                    const dropX = Math.cos(angle) * dist;
                    const dropY = Math.sin(angle) * dist;
                    
                    // Gota individual
                    octx.fillStyle = `rgba(${baseRGB}, ${0.5 + ((seed * i) % 5) / 10})`; // Opacidad aleatoria
                    octx.beginPath();
                    octx.arc(dropX, dropY, dropSize, 0, Math.PI * 2);
                    octx.fill();
                    
                    // Estelas/Rastros que conectan algunas gotas al centro (efecto salpicadura fuerte)
                    if (dist > splatRadius * 0.5 && dropSize > splatRadius * 0.04) {
                        octx.strokeStyle = `rgba(${baseRGB}, 0.45)`;
                        octx.lineWidth = dropSize * 0.7;
                        octx.lineCap = "round";
                        octx.beginPath();
                        octx.moveTo(dropX * 0.4, dropY * 0.4); // Empieza cerca del centro
                        octx.lineTo(dropX, dropY); // Termina en la gota
                        octx.stroke();
                    }
                }
            }

            octx.restore();
        }

        function drawCyberDartAndGlitch(octx, x, y, size, isCorrect, index, drawObject = true) {
            octx.save();
            const seed = (index * 123.456) % 100;
            const hitColor = isCorrect ? "#00ff41" : "#ff003c";

            // 1. Draw the physical/digital impact mark on the board FIRST (at x, y)
            octx.save();
            octx.translate(x, y);

            // A circular digital burn mark
            const burnGrad = octx.createRadialGradient(0, 0, 2, 0, 0, size * 1.2);
            burnGrad.addColorStop(0, "#000000");
            burnGrad.addColorStop(0.3, isCorrect ? "rgba(0, 255, 65, 0.45)" : "rgba(255, 0, 60, 0.45)");
            burnGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
            octx.fillStyle = burnGrad;
            octx.beginPath();
            octx.arc(0, 0, size * 1.2, 0, Math.PI * 2);
            octx.fill();

            // Puncture hole (needle hole)
            octx.fillStyle = "#000000";
            octx.beginPath();
            octx.arc(0, 0, size * 0.18, 0, Math.PI * 2);
            octx.fill();
            octx.strokeStyle = hitColor;
            octx.lineWidth = 1;
            octx.stroke();

            // Radial crack/fracture lines for realism
            octx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            octx.lineWidth = 1.2;
            const numCracks = 4 + (index % 3);
            for (let i = 0; i < numCracks; i++) {
                const angle = (i * Math.PI * 2 / numCracks) + (seed * 0.1);
                const len = size * (0.4 + (seed % 0.4));
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len);
                octx.stroke();
            }

            // Digital impact concentric ring
            octx.beginPath();
            octx.arc(0, 0, size * 0.7, 0, Math.PI * 2);
            octx.strokeStyle = hitColor;
            octx.lineWidth = size * 0.08;
            octx.stroke();

            // Glitch horizontal lines
            octx.fillStyle = hitColor;
            for(let i=0; i<3; i++) {
                const gw = size * (1.2 + (seed % 2));
                const gh = size * 0.1;
                const gy = (i - 1) * size * 0.35;
                const gx = ((seed * (i+1)) % 16) - 8;
                octx.fillRect(gx - gw/2, gy - gh/2, gw, gh);
            }

            octx.restore(); // restore from the impact mark translation

            // 2. Draw the dart if drawObject is true
            if (drawObject) {
                octx.save();
                octx.translate(x, y);
                
                const rotations = [-Math.PI/6, -Math.PI/4, -Math.PI/12, -Math.PI/3];
                const rot = rotations[index % rotations.length] || -Math.PI/4;
                octx.rotate(rot);

                // Tip/needle (stuck in the board)
                octx.strokeStyle = "#888888";
                octx.lineWidth = size * 0.08;
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.lineTo(size * 0.4, -size * 0.4);
                octx.stroke();

                // Barrel (main metallic weight with grip and neon strip)
                const barrelLength = size * 1.1;
                const barrelWidth = size * 0.22;
                
                octx.save();
                octx.translate(size * 0.4, -size * 0.4);
                octx.rotate(-Math.PI/4); // align horizontally for drawing gradient
                
                // Chrome steel gradient for the barrel
                const barrelGrad = octx.createLinearGradient(0, -barrelWidth/2, 0, barrelWidth/2);
                barrelGrad.addColorStop(0, "#444444");
                barrelGrad.addColorStop(0.3, "#ffffff");
                barrelGrad.addColorStop(0.5, "#aaaaaa");
                barrelGrad.addColorStop(0.8, "#333333");
                barrelGrad.addColorStop(1, "#222222");

                octx.fillStyle = barrelGrad;
                octx.fillRect(0, -barrelWidth/2, barrelLength, barrelWidth);

                // Knurling grooves (grip texture)
                octx.strokeStyle = "#111111";
                octx.lineWidth = 1.5;
                for (let i = 2; i < barrelLength - 2; i += 4) {
                    octx.beginPath();
                    octx.moveTo(i, -barrelWidth/2);
                    octx.lineTo(i, barrelWidth/2);
                    octx.stroke();
                }

                // Cyber neon stripe in the center of the barrel
                octx.fillStyle = hitColor;
                octx.shadowColor = hitColor;
                octx.shadowBlur = 8;
                octx.fillRect(2, -barrelWidth * 0.1, barrelLength - 4, barrelWidth * 0.2);
                octx.shadowBlur = 0; // reset shadow
                
                octx.restore();

                // Shaft (connecting stem)
                octx.strokeStyle = "#2b2b2b";
                octx.lineWidth = size * 0.1;
                octx.beginPath();
                octx.moveTo(size * 1.18, -size * 1.18);
                octx.lineTo(size * 1.75, -size * 1.75);
                octx.stroke();

                // Glow shadow for neon fins/flights
                octx.shadowColor = hitColor;
                octx.shadowBlur = 12;

                // Flight / wings (stiff futuristic cyber flight)
                octx.fillStyle = "rgba(17, 17, 17, 0.9)";
                octx.strokeStyle = hitColor;
                octx.lineWidth = size * 0.08;

                // Top fin
                octx.beginPath();
                octx.moveTo(size * 1.6, -size * 1.6);
                octx.lineTo(size * 2.5, -size * 2.2);
                octx.lineTo(size * 2.2, -size * 2.5);
                octx.lineTo(size * 1.7, -size * 1.7);
                octx.closePath();
                octx.fill(); octx.stroke();

                // Bottom fin (slightly larger/asymmetrical for 3D effect)
                octx.beginPath();
                octx.moveTo(size * 1.6, -size * 1.6);
                octx.lineTo(size * 2.2, -size * 2.5);
                octx.lineTo(size * 2.8, -size * 2.0);
                octx.lineTo(size * 1.7, -size * 1.7);
                octx.closePath();
                octx.fill(); octx.stroke();

                // Neon flight core
                octx.strokeStyle = "#ffffff";
                octx.lineWidth = size * 0.04;
                octx.beginPath();
                octx.moveTo(size * 1.7, -size * 1.7);
                octx.lineTo(size * 2.3, -size * 2.3);
                octx.stroke();

                octx.restore();
            } else {
                // For the final picture, just draw a big digital burn mark
                const scale = isCorrect ? 2.5 : 1.5;
                octx.fillStyle = isCorrect ? "rgba(0,255,65,0.2)" : "rgba(255,0,60,0.2)";
                octx.beginPath();
                octx.arc(x, y, size * scale, 0, Math.PI * 2);
                octx.fill();
                
                // Tech rings
                octx.strokeStyle = hitColor;
                octx.lineWidth = size * 0.1;
                octx.beginPath(); octx.arc(x, y, size * scale * 0.8, 0, Math.PI * 2); octx.stroke();
                octx.beginPath(); octx.arc(x, y, size * scale * 0.4, 0, Math.PI * 2); octx.stroke();

                // Cross
                octx.beginPath();
                octx.moveTo(x - size * scale, y); octx.lineTo(x + size * scale, y);
                octx.moveTo(x, y - size * scale); octx.lineTo(x, y + size * scale);
                octx.stroke();

                // Hexagon
                octx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = i * Math.PI / 3;
                    const r = size * scale * 1.1;
                    if (i === 0) octx.moveTo(x + Math.cos(angle)*r, y + Math.sin(angle)*r);
                    else octx.lineTo(x + Math.cos(angle)*r, y + Math.sin(angle)*r);
                }
                octx.closePath();
                octx.lineWidth = size * 0.05;
                octx.stroke();
            }

            octx.restore();
        }

        function generateMoniatoImage() {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = bgImg.width || 1024;
            offCanvas.height = bgImg.height || 1024;
            const octx = offCanvas.getContext('2d');
            
            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                octx.drawImage(bgImg, 0, 0, offCanvas.width, offCanvas.height);
            } else {
                octx.fillStyle = "#1a1a2e";
                octx.fillRect(0, 0, offCanvas.width, offCanvas.height);
            }
            
            const scale = Math.max(W / offCanvas.width, H / offCanvas.height);
            const scaledW = offCanvas.width * scale;
            const scaledH = offCanvas.height * scale;
            const offsetX = (W - scaledW) / 2;
            const offsetY = (H - scaledH) / 2;
            
            darts.forEach((d, idx) => {
                const imgX = (d.x - offsetX) / scale;
                const imgY = (d.y - offsetY) / scale;
                const size = offCanvas.width * 0.04; 
                
                if (gameMode === 1) {
                    drawQuillAndSplat(octx, imgX, imgY, size, d.correct, idx, false);
                } else {
                    drawCyberDartAndGlitch(octx, imgX, imgY, size, d.correct, idx, false);
                }
            });
            
            const barHeight = Math.floor(offCanvas.height * 0.12);
            octx.fillStyle = "rgba(0,0,0,0.7)";
            octx.fillRect(0, offCanvas.height - barHeight, offCanvas.width, barHeight);
            octx.fillStyle = "#ffd700";
            let fontSize = Math.floor(offCanvas.width * 0.042);
            if (fontSize > 45) fontSize = 45;
            if (fontSize < 16) fontSize = 16;
            octx.font = `bold ${fontSize}px sans-serif`;
            octx.textAlign = "center";
            octx.textBaseline = "middle";
            const scoreText = gameMode === 1 ? `Puntuació al Tir al Moniato suecà: ${totalScore} punts!` : `Puntuació al Tir al Moniato 2: ${totalScore} punts!`;
            octx.fillText(scoreText, offCanvas.width/2, offCanvas.height - (barHeight / 2));

            return offCanvas;
        }

        // Download Logic
        document.getElementById('btn-download').addEventListener('click', (e) => {
            e.stopPropagation();
            const offCanvas = generateMoniatoImage();
            const link = document.createElement('a');
            link.download = `Moniato_${totalScore}_punts.jpg`;
            link.href = offCanvas.toDataURL("image/jpeg", 0.9);
            link.click();
        });

        // Share Logic
        document.getElementById('btn-share').addEventListener('click', async (e) => {
            e.stopPropagation();
            const offCanvas = generateMoniatoImage();
            const shareTitle = gameMode === 1 ? '🪶 Tir al Moniato 1' : '⚡ Tir al Moniato 2';
            const shareText = `He fet ${totalScore} punts al "${shareTitle}" de Valencianismo Radio! ¿Pots superar-ho? Juga ací: https://valencianismo.com`;
            
            if (navigator.canShare) {
                offCanvas.toBlob(async (blob) => {
                    const file = new File([blob], `Moniato_${totalScore}_punts.jpg`, { type: 'image/jpeg' });
                    const shareData = {
                        title: shareTitle,
                        text: shareText,
                        files: [file]
                    };
                    
                    if (navigator.canShare(shareData)) {
                        try {
                            await navigator.share(shareData);
                        } catch (err) {
                            console.log('Error compartint', err);
                            // Fallback si la API falla por alguna restricción de seguridad o del iframe (que no sea AbortError)
                            if (err.name !== 'AbortError') {
                                navigator.clipboard.writeText(shareText);
                                alert("S'ha copiat el text. Ara es descarregarà l'image.");
                                document.getElementById('btn-download').click();
                            }
                        }
                    } else {
                        navigator.clipboard.writeText(shareText);
                        alert("S'ha copiat el text. Ara es descarregarà l'image.");
                        document.getElementById('btn-download').click();
                    }
                }, 'image/jpeg', 0.9);
            } else {
                navigator.clipboard.writeText(shareText);
                alert("S'ha copiat el text. Ara es descarregarà l'image.");
                document.getElementById('btn-download').click();
            }
        });

        // startAim(); and loop(); removed from global execution. They are now triggered by the intro screen buttons.
    </script>

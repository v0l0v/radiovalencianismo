<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tir al Moniato | Valencianismo Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        body { 
            margin: 0; background: #0a0a0f; color: #fff; 
            font-family: 'Outfit', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }
        #game-container { 
            position: relative; width: min(500px, 95vw); height: min(500px, 95vw); 
            background: url('assets/diana_juego.webp') center/cover; 
            border-radius: 20px; box-shadow: 0 0 40px rgba(0, 102, 204, 0.4); 
            overflow: hidden; cursor: crosshair;
        }
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; 
        }
        .ui { 
            text-align: center; margin-bottom: 20px; z-index: 20; 
            background: rgba(255,255,255,0.05); padding: 15px 30px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
        .score-board { 
            display: flex; gap: 15px; justify-content: center; margin-top: 15px; 
        }
        .circle-indicator { 
            width: 25px; height: 25px; border-radius: 50%; border: 2px solid #555; background: transparent; 
            display: flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: bold; color: #555;
            transition: all 0.3s;
        }
        .circle-indicator.hit { 
            background: #ffd700; border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.8); color: #000; 
        }
        
        /* Modal Question */
        #q-modal, #mode-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); 
            z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; 
        }
        #mode-modal { display: flex; z-index: 200; }
        .q-box { 
            background: #1a1a24; padding: 40px; border-radius: 20px; max-width: 90%; width: 500px; 
            text-align: center; border: 2px solid #00d2ff; box-shadow: 0 10px 40px rgba(0,210,255,0.3); 
        }
        .q-btn { 
            display: block; width: 100%; padding: 15px; margin: 12px 0; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
            color: white; border-radius: 10px; font-size: 1.1rem; cursor: pointer; 
            transition: all 0.2s; font-family: 'Outfit', sans-serif; font-weight: 600;
        }
        .q-btn:hover { 
            background: #00d2ff; color: #000; border-color: #00d2ff; transform: scale(1.02);
        }
        
        .message { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 800; text-transform: uppercase; 
            text-shadow: 0 5px 20px #000; z-index: 50; display: none; pointer-events: none; 
            text-align: center; width: 100%;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .blink-text { animation: blink 1.2s infinite; pointer-events: none; }
        
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255,255,255,0.1); color: #fff; text-decoration: none;
            padding: 10px 20px; border-radius: 50px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .back-btn:hover { background: #ffd700; color: #000; }
    </style>
</head>
<body>
    <div class="ui">
        <h1 id="title-text" style="color: #ffd700; margin: 0 0 5px 0;">🔥 Tir al Moniato 2</h1>
        <p style="margin: 0; color: #ccc;">Apunta, dispara i demostra els teus coneiximents.<br>Tens 9 intents. ¡Encerta el centre (9 punts) per a fer la màxima puntuació!</p>
        <div class="score-board" id="scoreboard">
            <!-- 9 indicators -->
            <div class="circle-indicator" id="c1" title="Tir 1">-</div>
            <div class="circle-indicator" id="c2" title="Tir 2">-</div>
            <div class="circle-indicator" id="c3" title="Tir 3">-</div>
            <div class="circle-indicator" id="c4" title="Tir 4">-</div>
            <div class="circle-indicator" id="c5" title="Tir 5">-</div>
            <div class="circle-indicator" id="c6" title="Tir 6">-</div>
            <div class="circle-indicator" id="c7" title="Tir 7">-</div>
            <div class="circle-indicator" id="c8" title="Tir 8">-</div>
            <div class="circle-indicator" id="c9" title="Tir 9">-</div>
        </div>
        <h2 style="color: #00d2ff; margin: 10px 0 0 0;" id="total-score">Punts: 0</h2>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="message" id="msg-text"></div>
        <div id="end-buttons" style="display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; gap: 15px;">
            <button id="btn-download" style="display: none; background: #8a9a5b; color: #fff; border: 3px solid #4a3600; padding: 15px 30px; font-size: 1.1rem; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.8); text-transform: uppercase;">📸 Descarregar</button>
            <button id="btn-share" style="background: #7928ca; color: #fff; border: 3px solid #3b0d6b; padding: 15px 30px; font-size: 1.1rem; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.8); text-transform: uppercase;">🔗 Compartir</button>
        </div>
    </div>

    <div id="q-modal">
        <div class="q-box">
            <h2 id="question-text" style="color:#ffd700; margin-top:0; font-size: 1.5rem; line-height: 1.4;">Pregunta</h2>
            <div id="options"></div>
        </div>
    </div>

    <div id="mode-modal">
        <div class="q-box">
            <h2 style="color:#ffd700; margin-top:0; font-size: 2rem;">Tir al Moniato</h2>
            <p style="color:#ccc; font-size: 1.1rem; margin-bottom: 20px;">Tria el teu mode de joc:</p>
            <button class="q-btn" id="btn-mode-1" style="font-size: 1.2rem; padding: 20px; text-align: left;">🪶 Joc 1: Pluma i Tinta</button>
            <button class="q-btn" id="btn-mode-2" style="font-size: 1.2rem; padding: 20px; text-align: left;">🔥 Joc 2: La Moniata Estelada</button>
        </div>
    </div>

    <script src="js/preguntes_racv.js"></script>
    <script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const bgImg = new Image();
        bgImg.src = 'assets/diana_juego.webp';
        
        const fuegoRealImg = new Image();
        fuegoRealImg.src = 'assets/fuego_foto.png';
        const agujeroImg = new Image();
        agujeroImg.src = 'assets/agujero_tela_masked.png';
        let W = container.clientWidth;
        let H = container.clientHeight;
        canvas.width = W;
        canvas.height = H;

        // Target setup
        const circles = 9;
        let radiusStep = (W/2) / (circles + 1);
        let maxRadius = circles * radiusStep;
        
        // State
        let aimX = W/2, aimY = H/2;
        let time = 0;
        let isAiming = true;
        let frozenX = 0, frozenY = 0;
        let attempts = 0;
        let totalScore = 0;
        const maxAttempts = 9;
        let darts = [];
        let aimTimer = null;
        let hasBeenWarned = false;
        let aimStartTime = 0;
        let gameEnded = false;
        let gameMode = 2; // Default a fuego
        
        document.getElementById('btn-mode-1').addEventListener('click', () => {
            gameMode = 1;
            document.getElementById('title-text').innerText = '🪶 Tir al Moniato 1';
            document.getElementById('mode-modal').style.display = 'none';
            document.getElementById('game-container').style.backgroundImage = "url('assets/diana_juego.webp')";
            bgImg.src = 'assets/diana_juego.webp';
            startAim();
        });
        
        document.getElementById('btn-mode-2').addEventListener('click', () => {
            gameMode = 2;
            document.getElementById('title-text').innerText = '🔥 La Moniata Estelada';
            document.getElementById('mode-modal').style.display = 'none';
            document.getElementById('game-container').style.backgroundImage = "url('assets/diana2_juego2.webp')";
            bgImg.src = 'assets/diana2_juego2.webp';
            startAim();
        });
        
        function startAim() {
            isAiming = true;
            aimStartTime = Date.now();
            clearTimeout(aimTimer);
            aimTimer = setTimeout(() => {
                if (!isAiming) return;
                isAiming = false;
                if (!hasBeenWarned) {
                    hasBeenWarned = true;
                    showMessage("¡AFANYA'T!\nTens 5 segons per disparar o fallaràs.\n(Mou el ratolí per a continuar)", "#fff", "#ff9900", false);
                    const onMove = () => {
                        canvas.removeEventListener('mousemove', onMove);
                        document.getElementById('msg-text').style.display = 'none';
                        startAim();
                    };
                    canvas.addEventListener('mousemove', onMove);
                } else {
                    frozenX = W/2;
                    frozenY = H/2;
                    handleAnswer(false, true);
                }
            }, 5000);
        }
        
        // Preguntes
        let availableQuestions = [];
        
        function initQuestions() {
            availableQuestions = questionsRACV.map((_, i) => i);
            // Shuffle
            for (let i = availableQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableQuestions[i], availableQuestions[j]] = [availableQuestions[j], availableQuestions[i]];
            }
        }
        initQuestions();
        
        function getNextQuestion() {
            if (availableQuestions.length === 0) {
                initQuestions(); // Reload if all 100 played
            }
            return availableQuestions.pop();
        }

        function drawTarget() {
            ctx.clearRect(0, 0, W, H);
            
            // Draw background dark tint (very light so face is visible)
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fillRect(0,0,W,H);
            
            // Draw concentric circles
            for(let i=circles; i>=1; i--) {
                ctx.beginPath();
                ctx.arc(W/2, H/2, i * radiusStep, 0, Math.PI*2);
                
                // Color alternates: faint fill, strong borders so the face is visible
                ctx.fillStyle = (i % 2 !== 0) ? "rgba(255,215,0,0.05)" : "rgba(255,42,42,0.08)";
                
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = (i % 2 !== 0) ? "rgba(255,215,0,0.8)" : "rgba(255,42,42,0.9)";
                
                ctx.stroke();
            }
            
            // Draw impactos
            darts.forEach((d, idx) => {
                if (gameMode === 1) {
                    drawQuillAndSplat(ctx, d.x, d.y, 22, d.correct, idx);
                } else {
                    drawFlamingArrowAndBurnHole(ctx, d.x, d.y, 25, d.correct, idx);
                }
            });

            // Draw Crosshair
            if (isAiming) {
                // Countdown timer
                const timeLeft = Math.max(0, 5 - Math.floor((Date.now() - aimStartTime) / 1000));
                ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                ctx.font = "bold " + (radiusStep * 1.5) + "px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(timeLeft, W/2, H/2);
                
                // Lissajous movement
                aimX = W/2 + Math.sin(time * 0.03) * (maxRadius * 0.9);
                aimY = H/2 + Math.cos(time * 0.043) * (maxRadius * 0.9);
                
                ctx.beginPath();
                ctx.arc(aimX, aimY, 15, 0, Math.PI*2);
                ctx.strokeStyle = "#00d2ff";
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(aimX-25, aimY); ctx.lineTo(aimX+25, aimY);
                ctx.moveTo(aimX, aimY-25); ctx.lineTo(aimX, aimY+25);
                ctx.stroke();
            } else {
                // Frozen crosshair
                ctx.beginPath();
                ctx.arc(frozenX, frozenY, 15, 0, Math.PI*2);
                ctx.strokeStyle = "#ff2a2a";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(frozenX-25, frozenY); ctx.lineTo(frozenX+25, frozenY);
                ctx.moveTo(frozenX, frozenY-25); ctx.lineTo(frozenX, frozenY+25);
                ctx.stroke();
            }
        }
        
        function loop() {
            if (isAiming) time++;
            drawTarget();
            requestAnimationFrame(loop);
        }
        
        // Interaction
        canvas.addEventListener('click', (e) => {
            if (gameEnded) {
                gameEnded = false;
                document.getElementById('end-buttons').style.display = 'none';
                const msg = document.getElementById('msg-text');
                msg.classList.remove('blink-text');
                msg.style.display = 'none';
                
                attempts = 0;
                totalScore = 0;
                document.getElementById('total-score').innerText = `Punts: 0`;
                darts = [];
                for(let i=1; i<=9; i++) {
                    const ind = document.getElementById('c'+i);
                    ind.classList.remove('hit');
                    ind.innerText = '-';
                    ind.style.background = '';
                    ind.style.borderColor = '';
                    ind.style.color = '';
                }
                hasBeenWarned = false;
                startAim();
                return;
            }

            if (!isAiming) return;
            clearTimeout(aimTimer);
            isAiming = false;
            
            frozenX = aimX;
            frozenY = aimY;
            
            setTimeout(() => {
                document.getElementById('msg-text').style.display = 'none';
                const qIndex = getNextQuestion();
                askQuestion(questionsRACV[qIndex]);
            }, 1800); // 1.8 sec pause
        });
        
        function askQuestion(qObj) {
            document.getElementById('q-modal').style.display = 'flex';
            document.getElementById('question-text').innerText = qObj.q;
            
            const optsDiv = document.getElementById('options');
            optsDiv.innerHTML = '';
            
            // Create a scrambled list of options
            let opts = qObj.o.map((o, i) => ({t: o, correct: i === qObj.a}));
            opts.sort(() => Math.random() - 0.5);
            
            opts.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'q-btn';
                btn.innerText = opt.t;
                btn.onclick = () => {
                    const allBtns = optsDiv.querySelectorAll('.q-btn');
                    allBtns.forEach(b => b.style.pointerEvents = 'none'); // Evitar doble click
                    
                    if (opt.correct) {
                        btn.style.background = '#00ff00';
                        btn.style.color = '#000';
                        btn.style.borderColor = '#00ff00';
                    } else {
                        btn.style.background = '#ff2a2a';
                        btn.style.color = '#fff';
                        btn.style.borderColor = '#ff2a2a';
                        // Resaltar la correcta
                        allBtns.forEach(b => {
                            if (b.innerText === qObj.o[qObj.a]) {
                                b.style.background = 'rgba(0, 255, 0, 0.8)';
                                b.style.color = '#000';
                                b.style.border = '2px solid #00ff00';
                            }
                        });
                    }
                    
                    setTimeout(() => handleAnswer(opt.correct), 2500); // 2.5s margin
                };
                optsDiv.appendChild(btn);
            });
        }
        
        function handleAnswer(isCorrect, isTimeout = false) {
            document.getElementById('q-modal').style.display = 'none';
            
            let dartX = frozenX;
            let dartY = frozenY;
            
            if (!isCorrect) {
                // Deviate wildly (50% to 150% of radius away)
                const angle = Math.random() * Math.PI * 2;
                const offset = (Math.random() * 1.0 + 0.5) * maxRadius;
                dartX += Math.cos(angle) * offset;
                dartY += Math.sin(angle) * offset;
                if (isTimeout) {
                    showMessage("¡TEMPS ESGOTAT!", "#fff", "#ff2a2a");
                } else {
                    showMessage("¡HAS FALLAT!", "#ff2a2a");
                }
            } else {
                showMessage("¡AHÍ LI DOL!", "#00d2ff");
            }
            
            darts.push({x: dartX, y: dartY, correct: isCorrect});
            
            // Calculate points
            let points = 0;
            const dist = Math.sqrt(Math.pow(dartX - W/2, 2) + Math.pow(dartY - H/2, 2));
            
            if (isCorrect && dist <= maxRadius) {
                const ringIndex = Math.floor(dist / radiusStep); // 0 is center, 8 is outermost
                if (ringIndex >= 0 && ringIndex < circles) {
                    points = circles - ringIndex; // Center = 9, outer = 1
                }
            }
            
            attempts++;
            totalScore += points;
            document.getElementById('total-score').innerText = `Punts: ${totalScore}`;
            
            // Update UI indicator
            const indicator = document.getElementById('c' + attempts);
            if (indicator) {
                indicator.innerText = points;
                indicator.classList.add('hit');
                if (points === 0) {
                    indicator.style.background = '#ff2a2a';
                    indicator.style.borderColor = '#ff2a2a';
                    indicator.style.color = '#fff';
                }
            }
            
            // Check end game
            if (attempts >= maxAttempts) {
                setTimeout(() => {
                    gameEnded = true;
                    document.getElementById('end-buttons').style.display = 'flex';
                    const msg = document.getElementById('msg-text');
                    msg.classList.add('blink-text');
                    showMessage(`¡FI DEL JOC!\n${totalScore} / 81\n(Fes clic per jugar atra volta)`, "#000", "#ffd700", false);
                }, 1500);
            } else {
                setTimeout(() => {
                    if (isTimeout) {
                        const onMoveTimeout = () => {
                            canvas.removeEventListener('mousemove', onMoveTimeout);
                            startAim();
                        };
                        canvas.addEventListener('mousemove', onMoveTimeout);
                    } else {
                        startAim();
                    }
                }, 1500);
            }
        }
        
        function showMessage(txt, color, bg = 'transparent', autoHide = true) {
            const msg = document.getElementById('msg-text');
            msg.innerText = txt;
            msg.style.color = color;
            msg.style.background = bg;
            if (bg !== 'transparent') {
                msg.style.padding = '15px 30px';
                msg.style.borderRadius = '10px';
                msg.style.border = `2px solid ${color === '#fff' ? 'rgba(255,255,255,0.3)' : color}`;
            } else {
                msg.style.padding = '0';
                msg.style.border = 'none';
            }
            msg.style.display = 'block';
            if (autoHide) {
                setTimeout(() => { msg.style.display = 'none'; }, 1500);
            }
        }
        
        const resizeObserver = new ResizeObserver(() => {
            if (container.clientWidth > 0) {
                W = container.clientWidth;
                H = container.clientHeight;
                canvas.width = W;
                canvas.height = H;
                radiusStep = (W/2) / (circles + 1);
                maxRadius = circles * radiusStep;
            }
        });
        resizeObserver.observe(container);
        
        function drawQuillAndSplat(octx, x, y, size, isCorrect, index, drawObject = true) {
            octx.save();
            
            const seed = (index * 123.456) % 100;

            if (drawObject) {
                const splatColor = isCorrect ? "#0033cc" : "#cc0000"; 
                octx.fillStyle = splatColor;
                
                const splatRadius = size * 0.8;
                octx.beginPath();
                octx.arc(x, y, splatRadius * 0.6, 0, Math.PI * 2);
                octx.fill();
                
                for (let i = 0; i < 7; i++) {
                    const angle = (i * Math.PI * 2) / 7 + seed;
                    const dropDist = splatRadius * (0.9 + ((seed + i) % 5) / 10);
                    const dropSize = splatRadius * 0.35 * (1 - (i % 3) * 0.2);
                    
                    octx.beginPath();
                    octx.arc(x + Math.cos(angle) * dropDist, y + Math.sin(angle) * dropDist, dropSize, 0, Math.PI * 2);
                    octx.fill();
                    
                    octx.beginPath();
                    octx.moveTo(x, y);
                    octx.lineTo(x + Math.cos(angle) * dropDist, y + Math.sin(angle) * dropDist);
                    octx.strokeStyle = splatColor;
                    octx.lineWidth = dropSize * 0.8;
                    octx.stroke();
                }

                octx.translate(x, y);
                const rotations = [-Math.PI/6, -Math.PI/4, -Math.PI/12, -Math.PI/3];
                const rot = rotations[index % rotations.length] || -Math.PI/4;
                octx.rotate(rot);
                
                octx.fillStyle = "#f8f9fa";
                octx.strokeStyle = "#e9ecef";
                octx.lineWidth = size * 0.05;
                
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.quadraticCurveTo(size * 0.5, -size * 0.2, size * 2.5, -size * 2.5);
                octx.quadraticCurveTo(size * 0.8, -size * 1.5, size * 0.2, -size * 0.5);
                octx.closePath();
                octx.fill();
                octx.stroke();
                
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.quadraticCurveTo(size * 0.2, -size * 0.5, size * 2.5, -size * 2.5);
                octx.quadraticCurveTo(size * 1.5, -size * 0.8, size * 0.5, -size * 0.2);
                octx.closePath();
                octx.fill();
                octx.stroke();
                
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.quadraticCurveTo(size * 1.0, -size * 1.0, size * 2.5, -size * 2.5);
                octx.strokeStyle = "#dee2e6";
                octx.lineWidth = size * 0.08;
                octx.stroke();

                octx.beginPath();
                octx.moveTo(0, 0);
                octx.lineTo(size * 0.3, -size * 0.1);
                octx.lineTo(size * 0.1, -size * 0.3);
                octx.closePath();
                octx.fillStyle = splatColor;
                octx.fill();
            } else {
                // Tinta realista para la imagen final
                octx.globalCompositeOperation = "multiply"; // La tinta "tinta" el papel oscureciéndolo
                
                // Azul índigo intenso si acierta, rojo carmesí oscuro si falla
                const baseRGB = isCorrect ? "10, 30, 110" : "130, 10, 20";
                
                const splatRadius = size * 2.8; // Mancha mucho más grande
                octx.translate(x, y);
                octx.rotate(seed); // Orientación completamente aleatoria
                
                // 1. Mancha absorbida (borde suave e irregular)
                octx.fillStyle = `rgba(${baseRGB}, 0.35)`;
                octx.beginPath();
                for (let i = 0; i < 12; i++) {
                    const angle = (i * Math.PI * 2) / 12;
                    const r = splatRadius * 0.7 * (0.7 + ((seed * i) % 6) / 10);
                    if (i === 0) octx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else octx.bezierCurveTo(
                        Math.cos(angle - 0.2) * r, Math.sin(angle - 0.2) * r,
                        Math.cos(angle) * r, Math.sin(angle) * r,
                        Math.cos(angle) * r, Math.sin(angle) * r
                    );
                }
                octx.closePath();
                octx.fill();
                
                // 2. Núcleo denso y oscuro de la mancha
                octx.fillStyle = `rgba(${baseRGB}, 0.85)`;
                octx.beginPath();
                for (let i = 0; i < 9; i++) {
                    const angle = (i * Math.PI * 2) / 9;
                    const r = splatRadius * 0.45 * (0.5 + ((seed * i * 3) % 8) / 10);
                    if (i === 0) octx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else octx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                octx.closePath();
                octx.fill();

                // 3. Salpicaduras dinámicas y gotas explosivas
                const drops = 15 + (seed % 12); // Entre 15 y 27 gotas
                for (let i = 0; i < drops; i++) {
                    const angle = (i * Math.PI * 2) / drops + ((seed * i) % 1);
                    const dist = splatRadius * (0.3 + ((seed * i * 7) % 15) / 10); // Variación de distancia
                    const dropSize = splatRadius * 0.15 * (1 - ((seed * i) % 8) / 10);
                    
                    const dropX = Math.cos(angle) * dist;
                    const dropY = Math.sin(angle) * dist;
                    
                    // Gota individual
                    octx.fillStyle = `rgba(${baseRGB}, ${0.5 + ((seed * i) % 5) / 10})`; // Opacidad aleatoria
                    octx.beginPath();
                    octx.arc(dropX, dropY, dropSize, 0, Math.PI * 2);
                    octx.fill();
                    
                    // Estelas/Rastros que conectan algunas gotas al centro (efecto salpicadura fuerte)
                    if (dist > splatRadius * 0.5 && dropSize > splatRadius * 0.04) {
                        octx.strokeStyle = `rgba(${baseRGB}, 0.45)`;
                        octx.lineWidth = dropSize * 0.7;
                        octx.lineCap = "round";
                        octx.beginPath();
                        octx.moveTo(dropX * 0.4, dropY * 0.4); // Empieza cerca del centro
                        octx.lineTo(dropX, dropY); // Termina en la gota
                        octx.stroke();
                    }
                }
            }

            octx.restore();
        }

        function drawFlamingArrowAndBurnHole(octx, x, y, size, isCorrect, index, drawObject = true) {
            octx.save();
            
            // Agujero quemado
            const burnColor = isCorrect ? "#111111" : "#3a0000"; // Más oscuro si acierta, más rojizo si falla
            octx.fillStyle = burnColor;
            
            const holeRadius = size * 0.5;
            const seed = (index * 123.456) % 100;
            
            // Borde exterior quemado (difuminado)
            octx.shadowColor = isCorrect ? "#ff4500" : "#ff0000";
            octx.shadowBlur = size * 0.6;
            
            octx.beginPath();
            for (let i = 0; i < 10; i++) {
                const angle = (i * Math.PI * 2) / 10;
                const r = holeRadius * (0.8 + ((seed * i) % 5) / 10);
                if (i === 0) octx.moveTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
                else octx.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
            }
            octx.closePath();
            octx.fill();
            
            octx.shadowBlur = 0; // reset shadow
            
            // Brasas alrededor del agujero
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5 + seed;
                const dist = holeRadius * (1.1 + (seed % 4)/10);
                octx.beginPath();
                octx.arc(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist, size * 0.1, 0, Math.PI*2);
                octx.fillStyle = (i % 2 === 0) ? "rgba(255, 69, 0, 0.8)" : "rgba(255, 140, 0, 0.9)";
                octx.fill();
            }

            octx.translate(x, y);

            if (drawObject) {
                // Flecha clavada
                const rotations = [-Math.PI/6, -Math.PI/4, -Math.PI/12, -Math.PI/3];
                const rot = rotations[index % rotations.length] || -Math.PI/4;
                octx.rotate(rot);
                
                // Palo de madera
                octx.beginPath();
                octx.moveTo(0, 0);
                octx.lineTo(size * 2.5, -size * 2.5);
                octx.strokeStyle = "#4a2a10";
                octx.lineWidth = size * 0.12;
                octx.lineCap = "round";
                octx.stroke();

                // Plumas de la flecha (cola)
                octx.fillStyle = "#cccccc";
                octx.beginPath();
                octx.moveTo(size * 2.0, -size * 2.0);
                octx.lineTo(size * 2.7, -size * 1.7);
                octx.lineTo(size * 2.4, -size * 2.4);
                octx.fill();
                
                octx.beginPath();
                octx.moveTo(size * 2.0, -size * 2.0);
                octx.lineTo(size * 1.7, -size * 2.7);
                octx.lineTo(size * 2.4, -size * 2.4);
                octx.fill();
                
                // Fuego intenso en la punta clavada
                octx.fillStyle = "rgba(255, 69, 0, 0.8)"; // Naranja rojizo
                octx.beginPath();
                octx.arc(size * 0.2, -size * 0.2, size * 0.4, 0, Math.PI*2);
                octx.fill();
                
                octx.fillStyle = "rgba(255, 140, 0, 0.9)"; // Naranja claro
                octx.beginPath();
                octx.arc(size * 0.1, -size * 0.1, size * 0.25, 0, Math.PI*2);
                octx.fill();
                
                octx.fillStyle = "rgba(255, 255, 0, 0.9)"; // Amarillo
                octx.beginPath();
                octx.arc(0, 0, size * 0.15, 0, Math.PI*2);
                octx.fill();
                
                // Llama que sube por el palo
                octx.fillStyle = "rgba(255, 69, 0, 0.7)";
                octx.beginPath();
                octx.moveTo(size * 0.4, -size * 0.4);
                octx.quadraticCurveTo(size * 0.8, -size * 0.1, size * 1.2, -size * 1.2);
                octx.quadraticCurveTo(size * 0.3, -size * 0.8, size * 0.1, -size * 0.5);
                octx.fill();
                
                octx.fillStyle = "rgba(255, 140, 0, 0.6)";
                octx.beginPath();
                octx.moveTo(size * 0.3, -size * 0.3);
                octx.quadraticCurveTo(size * 0.6, -size * 0.2, size * 0.9, -size * 0.9);
                octx.quadraticCurveTo(size * 0.2, -size * 0.6, size * 0.1, -size * 0.4);
                octx.fill();
            } else {
                // ── FOTO FINAL: 4 tipos de llamas canvas, integradas en la bandera ──
                octx.save();

                // Tamaño base: más grande para aciertos, más pequeño para fallos
                const fireScale = isCorrect ? size * 2.6 : size * 1.6;
                const seedVal = (seed * 137.508);
                const flameType = index % 4; // 4 tipos distintos de llama

                // 1. Agujero quemado base (igual para todos los tipos)
                octx.globalCompositeOperation = "source-over";
                const holeR = fireScale * 0.32;
                if (agujeroImg.complete && agujeroImg.naturalHeight !== 0) {
                    const aW = holeR * 3.2;
                    octx.drawImage(agujeroImg, -aW / 2, -aW / 2, aW, aW);
                } else {
                    // Agujero quemado dibujado a mano (fallback)
                    const burnGrad = octx.createRadialGradient(0, 0, 0, 0, 0, holeR);
                    burnGrad.addColorStop(0,   "rgba(5,2,0,1)");
                    burnGrad.addColorStop(0.6, "rgba(30,8,0,0.9)");
                    burnGrad.addColorStop(1,   "rgba(80,20,0,0)");
                    octx.fillStyle = burnGrad;
                    octx.beginPath();
                    octx.arc(0, 0, holeR * 1.4, 0, Math.PI*2);
                    octx.fill();
                }

                // ── HELPERS DE LLAMA ──────────────────────────────────────────────

                // Dibuja una llama tipo "lengua" con gradiente
                function drawTongue(cx, cy, w, h, lean, colors) {
                    const grad = octx.createLinearGradient(cx, cy, cx + lean * w, cy - h);
                    grad.addColorStop(0,   colors[0]);
                    grad.addColorStop(0.4, colors[1]);
                    grad.addColorStop(0.75, colors[2]);
                    grad.addColorStop(1,   colors[3]);
                    octx.fillStyle = grad;
                    octx.beginPath();
                    octx.moveTo(cx - w * 0.5, cy);
                    octx.bezierCurveTo(
                        cx - w * 0.6,  cy - h * 0.35,
                        cx + lean * w - w * 0.3, cy - h * 0.65,
                        cx + lean * w, cy - h
                    );
                    octx.bezierCurveTo(
                        cx + lean * w + w * 0.3, cy - h * 0.65,
                        cx + w * 0.6,  cy - h * 0.35,
                        cx + w * 0.5, cy
                    );
                    octx.closePath();
                    octx.fill();
                }

                // Brasas/destellos alrededor del agujero
                function drawEmbers(count, radius, col) {
                    for (let e = 0; e < count; e++) {
                        const a = (e * Math.PI * 2 / count) + (seedVal % 1.5);
                        const d = radius * (0.9 + (seedVal * e % 3) / 10);
                        const r = radius * 0.08 * (0.5 + (seedVal * e % 5) / 10);
                        octx.fillStyle = col;
                        octx.beginPath();
                        octx.arc(Math.cos(a) * d, Math.sin(a) * d, r, 0, Math.PI*2);
                        octx.fill();
                    }
                }

                // ── TIPO 0: Llama medieval clásica (naranja dorada) ───────────────
                if (flameType === 0) {
                    // Aura exterior difusa
                    const aura = octx.createRadialGradient(0, 0, holeR * 0.3, 0, -fireScale * 0.2, fireScale * 0.9);
                    aura.addColorStop(0,   "rgba(255,120,0,0.35)");
                    aura.addColorStop(0.5, "rgba(255,60,0,0.15)");
                    aura.addColorStop(1,   "rgba(255,0,0,0)");
                    octx.fillStyle = aura;
                    octx.beginPath();
                    octx.ellipse(0, -fireScale * 0.1, fireScale * 0.85, fireScale * 1.1, 0, 0, Math.PI*2);
                    octx.fill();
                    // Lenguas
                    drawTongue(-fireScale*0.18, 0, fireScale*0.55, fireScale*1.35, -0.12,
                        ["rgba(255,60,0,0.9)","rgba(255,120,0,0.85)","rgba(255,200,0,0.7)","rgba(255,240,100,0)"]);
                    drawTongue(0, 0, fireScale*0.42, fireScale*1.65, 0.05,
                        ["rgba(255,80,0,0.95)","rgba(255,160,0,0.9)","rgba(255,220,50,0.7)","rgba(255,255,200,0)"]);
                    drawTongue(fireScale*0.2, 0, fireScale*0.45, fireScale*1.1, 0.18,
                        ["rgba(255,50,0,0.88)","rgba(255,130,0,0.8)","rgba(255,200,0,0.6)","rgba(255,240,80,0)"]);
                    // Núcleo brillante
                    const core0 = octx.createRadialGradient(0, -fireScale*0.05, 0, 0, -fireScale*0.05, holeR * 1.2);
                    core0.addColorStop(0,   "rgba(255,255,180,1)");
                    core0.addColorStop(0.4, "rgba(255,220,80,0.9)");
                    core0.addColorStop(1,   "rgba(255,100,0,0)");
                    octx.fillStyle = core0;
                    octx.beginPath();
                    octx.arc(0, -fireScale*0.05, holeR * 1.2, 0, Math.PI*2);
                    octx.fill();
                    drawEmbers(8, holeR * 1.8, "rgba(255,140,0,0.9)");
                }

                // ── TIPO 1: Llama roja intensa (carmesí, 4 lenguas anchas) ─────────
                if (flameType === 1) {
                    const aura1 = octx.createRadialGradient(0, 0, holeR * 0.2, 0, -fireScale * 0.15, fireScale * 0.95);
                    aura1.addColorStop(0,   "rgba(255,40,0,0.45)");
                    aura1.addColorStop(0.5, "rgba(220,20,0,0.2)");
                    aura1.addColorStop(1,   "rgba(180,0,0,0)");
                    octx.fillStyle = aura1;
                    octx.beginPath();
                    octx.ellipse(0, -fireScale * 0.08, fireScale * 0.8, fireScale * 1.05, 0, 0, Math.PI*2);
                    octx.fill();
                    drawTongue(-fireScale*0.22, 0, fireScale*0.52, fireScale*1.2, -0.18,
                        ["rgba(200,10,0,0.95)","rgba(255,50,0,0.9)","rgba(255,140,0,0.7)","rgba(255,220,60,0)"]);
                    drawTongue(-fireScale*0.05, 0, fireScale*0.44, fireScale*1.55, -0.04,
                        ["rgba(220,20,0,0.98)","rgba(255,80,0,0.92)","rgba(255,170,0,0.68)","rgba(255,240,80,0)"]);
                    drawTongue(fireScale*0.15, 0, fireScale*0.48, fireScale*1.28, 0.12,
                        ["rgba(210,15,0,0.9)","rgba(255,60,0,0.85)","rgba(255,150,0,0.65)","rgba(255,230,50,0)"]);
                    drawTongue(fireScale*0.28, 0, fireScale*0.35, fireScale*0.95, 0.25,
                        ["rgba(190,8,0,0.85)","rgba(255,45,0,0.8)","rgba(255,120,0,0.55)","rgba(255,210,40,0)"]);
                    const core1 = octx.createRadialGradient(0, -fireScale*0.04, 0, 0, -fireScale*0.04, holeR * 1.15);
                    core1.addColorStop(0,   "rgba(255,240,150,1)");
                    core1.addColorStop(0.35,"rgba(255,190,30,0.95)");
                    core1.addColorStop(0.75,"rgba(255,80,0,0.6)");
                    core1.addColorStop(1,   "rgba(200,10,0,0)");
                    octx.fillStyle = core1;
                    octx.beginPath();
                    octx.arc(0, -fireScale*0.04, holeR * 1.15, 0, Math.PI*2);
                    octx.fill();
                    drawEmbers(10, holeR * 1.9, "rgba(255,90,0,0.95)");
                }

                // ── TIPO 2: Llama alta y esbelta (amarillo-naranja, muy caliente) ───
                if (flameType === 2) {
                    const aura2 = octx.createRadialGradient(0, -fireScale*0.1, holeR*0.2, 0, -fireScale*0.4, fireScale*0.85);
                    aura2.addColorStop(0,   "rgba(255,160,0,0.4)");
                    aura2.addColorStop(0.5, "rgba(255,90,0,0.18)");
                    aura2.addColorStop(1,   "rgba(255,30,0,0)");
                    octx.fillStyle = aura2;
                    octx.beginPath();
                    octx.ellipse(0, -fireScale*0.25, fireScale*0.7, fireScale*1.25, 0, 0, Math.PI*2);
                    octx.fill();
                    drawTongue(-fireScale*0.14, 0, fireScale*0.4, fireScale*1.7, -0.08,
                        ["rgba(255,80,0,0.92)","rgba(255,160,0,0.88)","rgba(255,230,60,0.72)","rgba(255,255,180,0)"]);
                    drawTongue(0, 0, fireScale*0.34, fireScale*2.05, 0.02,
                        ["rgba(255,100,0,0.96)","rgba(255,180,0,0.9)","rgba(255,240,80,0.7)","rgba(255,255,200,0)"]);
                    drawTongue(fireScale*0.16, 0, fireScale*0.38, fireScale*1.55, 0.14,
                        ["rgba(255,70,0,0.88)","rgba(255,150,0,0.85)","rgba(255,220,50,0.65)","rgba(255,255,160,0)"]);
                    const core2 = octx.createRadialGradient(0, -fireScale*0.1, 0, 0, -fireScale*0.1, holeR * 1.3);
                    core2.addColorStop(0,   "rgba(255,255,220,1)");
                    core2.addColorStop(0.3, "rgba(255,240,100,0.95)");
                    core2.addColorStop(0.65,"rgba(255,160,0,0.7)");
                    core2.addColorStop(1,   "rgba(255,60,0,0)");
                    octx.fillStyle = core2;
                    octx.beginPath();
                    octx.arc(0, -fireScale*0.1, holeR * 1.3, 0, Math.PI*2);
                    octx.fill();
                    drawEmbers(7, holeR * 1.75, "rgba(255,180,0,0.9)");
                }

                // ── TIPO 3: Llama ancha de hoguera (5 lenguas, naranja profundo) ───
                if (flameType === 3) {
                    const aura3 = octx.createRadialGradient(0, 0, holeR*0.1, 0, -fireScale*0.2, fireScale*1.0);
                    aura3.addColorStop(0,   "rgba(255,130,0,0.42)");
                    aura3.addColorStop(0.5, "rgba(255,70,0,0.18)");
                    aura3.addColorStop(1,   "rgba(255,20,0,0)");
                    octx.fillStyle = aura3;
                    octx.beginPath();
                    octx.ellipse(0, -fireScale*0.1, fireScale*1.0, fireScale*1.1, 0, 0, Math.PI*2);
                    octx.fill();
                    drawTongue(-fireScale*0.32, 0, fireScale*0.45, fireScale*0.98, -0.28,
                        ["rgba(220,30,0,0.9)","rgba(255,90,0,0.85)","rgba(255,180,0,0.65)","rgba(255,240,80,0)"]);
                    drawTongue(-fireScale*0.12, 0, fireScale*0.52, fireScale*1.3, -0.1,
                        ["rgba(240,40,0,0.95)","rgba(255,110,0,0.88)","rgba(255,200,0,0.7)","rgba(255,250,120,0)"]);
                    drawTongue(fireScale*0.02, 0, fireScale*0.4, fireScale*1.55, 0.04,
                        ["rgba(255,60,0,0.98)","rgba(255,140,0,0.92)","rgba(255,220,50,0.72)","rgba(255,255,180,0)"]);
                    drawTongue(fireScale*0.2, 0, fireScale*0.5, fireScale*1.18, 0.16,
                        ["rgba(235,35,0,0.9)","rgba(255,100,0,0.85)","rgba(255,190,0,0.65)","rgba(255,240,70,0)"]);
                    drawTongue(fireScale*0.35, 0, fireScale*0.38, fireScale*0.88, 0.3,
                        ["rgba(210,20,0,0.85)","rgba(255,75,0,0.8)","rgba(255,160,0,0.58)","rgba(255,230,60,0)"]);
                    const core3 = octx.createRadialGradient(0, -holeR*0.4, 0, 0, -holeR*0.4, holeR * 1.25);
                    core3.addColorStop(0,   "rgba(255,255,190,1)");
                    core3.addColorStop(0.4, "rgba(255,210,60,0.95)");
                    core3.addColorStop(0.75,"rgba(255,120,0,0.7)");
                    core3.addColorStop(1,   "rgba(255,40,0,0)");
                    octx.fillStyle = core3;
                    octx.beginPath();
                    octx.arc(0, -holeR*0.4, holeR * 1.25, 0, Math.PI*2);
                    octx.fill();
                    drawEmbers(11, holeR * 2.1, "rgba(255,120,0,0.9)");
                }

                octx.restore();
            }

            octx.restore();
        }

        function generateMoniatoImage() {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = bgImg.width || 1024;
            offCanvas.height = bgImg.height || 1024;
            const octx = offCanvas.getContext('2d');
            
            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                octx.drawImage(bgImg, 0, 0, offCanvas.width, offCanvas.height);
            } else {
                octx.fillStyle = "#1a1a2e";
                octx.fillRect(0, 0, offCanvas.width, offCanvas.height);
            }
            
            const scale = Math.max(W / offCanvas.width, H / offCanvas.height);
            const scaledW = offCanvas.width * scale;
            const scaledH = offCanvas.height * scale;
            const offsetX = (W - scaledW) / 2;
            const offsetY = (H - scaledH) / 2;
            
            darts.forEach((d, idx) => {
                const imgX = (d.x - offsetX) / scale;
                const imgY = (d.y - offsetY) / scale;
                const size = offCanvas.width * 0.04; 
                
                if (gameMode === 1) {
                    drawQuillAndSplat(octx, imgX, imgY, size, d.correct, idx, false);
                } else {
                    drawFlamingArrowAndBurnHole(octx, imgX, imgY, size, d.correct, idx, false);
                }
            });
            
            const barHeight = Math.floor(offCanvas.height * 0.12);
            octx.fillStyle = "rgba(0,0,0,0.7)";
            octx.fillRect(0, offCanvas.height - barHeight, offCanvas.width, barHeight);
            octx.fillStyle = "#ffd700";
            let fontSize = Math.floor(offCanvas.width * 0.042);
            if (fontSize > 45) fontSize = 45;
            if (fontSize < 16) fontSize = 16;
            octx.font = `bold ${fontSize}px sans-serif`;
            octx.textAlign = "center";
            octx.textBaseline = "middle";
            const scoreText = gameMode === 1 ? `Puntuació al Tir al Moniato suecà: ${totalScore} punts!` : `Puntuació a La Moniata Estelada: ${totalScore} punts!`;
            octx.fillText(scoreText, offCanvas.width/2, offCanvas.height - (barHeight / 2));

            return offCanvas;
        }

        // Download Logic
        document.getElementById('btn-download').addEventListener('click', (e) => {
            e.stopPropagation();
            const offCanvas = generateMoniatoImage();
            const link = document.createElement('a');
            link.download = `Moniato_${totalScore}_punts.jpg`;
            link.href = offCanvas.toDataURL("image/jpeg", 0.9);
            link.click();
        });

        // Share Logic
        document.getElementById('btn-share').addEventListener('click', async (e) => {
            e.stopPropagation();
            const offCanvas = generateMoniatoImage();
            const shareTitle = gameMode === 1 ? '🪶 Tir al Moniato 1' : '🔥 La Moniata Estelada';
            const shareText = `He fet ${totalScore} punts al "${shareTitle}" de Valencianismo Radio! ¿Pots superar-ho? Juga ací: https://valencianismo.com`;
            
            if (navigator.canShare) {
                offCanvas.toBlob(async (blob) => {
                    const file = new File([blob], `Moniato_${totalScore}_punts.jpg`, { type: 'image/jpeg' });
                    const shareData = {
                        title: shareTitle,
                        text: shareText,
                        files: [file]
                    };
                    
                    if (navigator.canShare(shareData)) {
                        try {
                            await navigator.share(shareData);
                        } catch (err) {
                            console.log('Error compartint', err);
                            // Fallback si la API falla por alguna restricción de seguridad o del iframe (que no sea AbortError)
                            if (err.name !== 'AbortError') {
                                navigator.clipboard.writeText(shareText);
                                alert("S'ha copiat el text. Ara es descarregarà l'image.");
                                document.getElementById('btn-download').click();
                            }
                        }
                    } else {
                        navigator.clipboard.writeText(shareText);
                        alert("S'ha copiat el text. Ara es descarregarà l'image.");
                        document.getElementById('btn-download').click();
                    }
                }, 'image/jpeg', 0.9);
            } else {
                navigator.clipboard.writeText(shareText);
                alert("S'ha copiat el text. Ara es descarregarà l'image.");
                document.getElementById('btn-download').click();
            }
        });

        loop();
    </script>
